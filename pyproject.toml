[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-compressor"
version = "0.1.0"
description = "A simple command-line video compression tool"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
videocomp = "video_compressor.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
